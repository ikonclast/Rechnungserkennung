services:
  postgres:
    image: postgres:16-alpine
    container_name: rechnungserkennung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ${DATA_ROOT:-/srv/data/rechnungserkennung}/postgres:/var/lib/postgresql/data
    networks:
      - rechnungserkennung_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rechnungserkennung-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ${DATA_ROOT:-/srv/data/rechnungserkennung}/minio:/data
    networks:
      - rechnungserkennung_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: rechnungserkennung-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_INVOICES: ${MINIO_BUCKET_INVOICES}
      MINIO_BUCKET_OUTPUT: ${MINIO_BUCKET_OUTPUT}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_INVOICES &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_OUTPUT
      "
    networks:
      - rechnungserkennung_net
    restart: "no"

networks:
  rechnungserkennung_net:
    name: rechnungserkennung_net
